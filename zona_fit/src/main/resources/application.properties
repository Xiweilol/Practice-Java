# Nombre app
spring.application.name=zona_fit

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/zona_fit_db
spring.datasource.username=root
spring.datasource.password=XiWei
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desactivar app web / Tomcat
spring.main.web-application-type=none

# Quitar banner de Spring Boot
spring.main.banner-mode=off

# Reducir logs
logging.level.root=INFO
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
logging.level.com.zaxxer.hikari=OFF
logging.level.mysql=OFF
logging.level.com.mysql=OFF